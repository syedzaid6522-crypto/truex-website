<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Love Letter for Anbar Ahmedi</title>
    <style>
        /* ──────────────────────────────────────────────────────────────
           Premium visual design (dark theme, gold accents, serif headings)
           ────────────────────────────────────────────────────────────── */
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a1a 0%, #2c2c2c 100%);
            --card-bg: #242424;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --accent: #d4af37;           /* gold */
            --accent-hover: #b5932a;
            --font-heading: 'Playfair Display', 'Georgia', serif;
            --font-body: 'Lato', 'Helvetica Neue', sans-serif;
            --spacing: 2rem;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ───── Page container & transition animation ───── */
        .page-container {
            width: 100%;
            max-width: 600px;
            perspective: 1000px;
            padding: var(--spacing);
        }

        .page {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border-top: 3px solid var(--accent);
            display: none;           /* hidden by default – JS will show the active one */
            animation: fadeSlide 0.7s ease-out forwards;
        }

        .page.active { display: block; }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ───── Typography ───── */
        h1, h2, .greeting {
            font-family: var(--font-heading);
            color: var(--accent);
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.3;
        }

        h1 { font-size: 2.2rem; }
        h2 { font-size: 1.6rem; border-bottom: 1px solid var(--accent); display: inline-block; padding-bottom: 0.3rem; }

        .greeting { font-size: 2rem; margin-bottom: 0.5rem; }
        .subject-line { font-size: 1.2rem; font-weight: 300; text-align: center; margin-bottom: 2rem; color: var(--text-muted); }

        p { line-height: 1.8; margin-bottom: 1.5rem; font-size: 1.08rem; }

        /* ───── Navigation buttons ───── */
        .nav {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        button {
            background: var(--accent);
            color: #1a1a1a;
            border: none;
            padding: 0.6rem 1.4rem;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover { background: var(--accent-hover); transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        /* ───── Small decorative heart icon ───── */
        .heart {
            display: inline-block;
            color: var(--accent);
            font-size: 1.2rem;
            animation: pulse 1.5s infinite;
            margin-left: 0.3rem;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* ───── Responsive ───── */
        @media (max-width: 480px) {
            .page { padding: 2rem 1.5rem; }
            h1 { font-size: 1.8rem; }
            .greeting { font-size: 1.6rem; }
        }
    </style>
    <!-- Google Fonts – you can swap for any other if you like -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>

<div class="page-container">
