<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueX Enterprises | Premium</title>
<!-- Importing Premium Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@200;300;400&display=swap" rel="stylesheet">

<style>
/* --- VARIABLES & RESET --- */
:root {
    --bg-dark: #050505;
    --bg-panel: #121212;
    --text-main: #f0f0f0;
    --text-muted: #a0a0a0;
    --gold: #D4AF37;
    --gold-light: #F2D06B;
    --gold-dim: #755B1F;
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --font-head: 'Playfair Display', serif;
    --font-body: 'Poppins', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-body);
    overflow-x: hidden;
    height: 100vh;
    width: 100vw;
}

/* --- TYPOGRAPHY --- */
h1, h2, h3 {
    font-family: var(--font-head);
    font-weight: 700;
    letter-spacing: 1px;
}

h1 {
    font-size: 3rem;
    background: linear-gradient(to right, var(--gold), var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
}

p {
    font-weight: 300;
    line-height: 1.6;
    color: var(--text-muted);
}

/* --- NAVIGATION --- */
.nav-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 500px;
    background: rgba(20, 20, 20, 0.8);
    backdrop-filter: blur(15px);
    border: 1px solid var(--glass-border);
    border-radius: 50px;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.nav-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.3s;
    padding: 8px 12px;
    border-radius: 20px;
}

.nav-btn:hover, .nav-btn.active {
    color: var(--bg-dark);
    background: var(--gold);
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
}

/* --- PAGES & TRANSITIONS --- */
.page-container {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

.page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px 20px 60px; /* Top padding clears the nav */
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    pointer-events: none;
}

.page.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
    z-index: 10;
}

/* --- CONTENT CARDS --- */
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 900px;
    margin-top: 30px;
}

.card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    padding: 30px;
    border-radius: 16px;
    text-align: left;
    transition: 0.4s ease;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    transform: scaleX(0);
    transform-origin: left;
    transition: 0.4s ease;
}

.card:hover {
    background: rgba(255, 255, 255, 0.06);
    transform: translateY(-5px);
    border-color: var(--glass-border);
}

.card:hover::before {
    transform: scaleX(1);
}

.card h3 {
    color: var(--gold-light);
    margin-bottom: 10px;
    font-family: var(--font-body); /* Using sans for UI headers */
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.card p {
    font-size: 0.9rem;
}

/* --- BUTTONS --- */
.btn-nav {
    margin-top: 40px;
    display: flex;
    gap: 20px;
}

.btn {
    padding: 12px 30px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-family: var(--font-body);
    font-size: 0.9rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 4px;
    text-transform: uppercase;
}

.btn:hover {
    background: var(--gold);
    color: var(--bg-dark);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
}

.btn-ghost {
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--text-muted);
}
.btn-ghost:hover {
    background: var(--text-main);
    color: var(--bg-dark);
    box-shadow: none;
}

/* --- FLOATING WHATSAPP --- */
.whatsapp-float {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    background: #25D366;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 28px;
    box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
    z-index: 1000;
    transition: 0.3s;
    text-decoration: none;
    animation: pulse 2s infinite;
}

.whatsapp-float:hover {
    transform: scale(1.1) translateY(-5px);
}

/* --- FOOTER --- */
footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.2);
    z-index: 999;
}

.email-link {
    display: inline-block;
    margin-top: 20px;
    color: var(--gold);
    text-decoration: none;
    font-family: var(--font-head);
    border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    padding-bottom: 3px;
    transition: 0.3s;
}

.email-link:hover {
    border-color: var(--gold);
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
}

/* --- ANIMATIONS --- */
@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); }
    70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
    100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
}

@media (max-width: 600px) {
    h1 { font-size: 2rem; }
    .nav-container { bottom: 20px; top: auto; width: 95%; padding: 10px; }
    .page { justify-content: flex-start; padding-top: 100px; }
}

</style>
</head>
